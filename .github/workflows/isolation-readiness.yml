name: Public container boundary probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/isolation-readiness.yml

permissions: {}

jobs:
  public-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public synthetic host marker boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          report_path = Path(os.environ['RUNNER_TEMP']) / 'public-container-probe.json'
          report = {'probe': 'public-synthetic-marker-only', 'development_ready': False,
                    'image': 'python:3.12-slim', 'image_digest': None,
                    'host_read': False, 'candidate_read_denied': False,
                    'public_mount_read': False, 'status': 'failed'}

          def docker(*args):
              result = subprocess.run(['docker', *args], capture_output=True, text=True,
                                      timeout=180, check=False)
              if result.returncode:
                  raise RuntimeError('docker_operation_failed')
              return result.stdout

          try:
              with tempfile.TemporaryDirectory(prefix='public-boundary-') as root:
                  root = Path(root)
                  marker = root / 'host-marker.txt'
                  marker.write_text('PUBLIC-SYNTHETIC-HOST-MARKER\n')
                  public = root / 'public'
                  public.mkdir(mode=0o755)
                  (public / 'public-marker.txt').write_text('PUBLIC-MOUNT-CONTROL\n')
                  (public / 'probe.py').write_text('''import json, pathlib, sys
          denied = False
          try:
              pathlib.Path(sys.argv[1]).read_bytes()
          except (FileNotFoundError, PermissionError):
              denied = True
          public_read = pathlib.Path('/public/public-marker.txt').read_text() == 'PUBLIC-MOUNT-CONTROL\\n'
          print(json.dumps({'candidate_read_denied': denied, 'public_mount_read': public_read}))
          sys.exit(0 if denied and public_read else 1)
          ''')
                  docker('pull', report['image'])
                  digests = json.loads(docker('image', 'inspect', report['image'], '--format', '{{json .RepoDigests}}'))
                  digest = next(d for d in digests if d.startswith('python@sha256:'))
                  report['image_digest'] = digest
                  report['host_read'] = marker.read_text() == 'PUBLIC-SYNTHETIC-HOST-MARKER\n'
                  result = json.loads(docker(
                      'run', '--rm', '--network', 'none', '--user', '65532:65532',
                      '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges:true',
                      '--pids-limit', '32', '--memory', '128m', '--cpus', '1',
                      '--mount', f'type=bind,source={public},target=/public,readonly',
                      digest, 'python', '-I', '-B', '/public/probe.py', str(marker)))
                  report['candidate_read_denied'] = result['candidate_read_denied'] is True
                  report['public_mount_read'] = result['public_mount_read'] is True
                  if all(report[k] for k in ('host_read', 'candidate_read_denied', 'public_mount_read')):
                      report['status'] = 'probe_passed'
          except Exception:
              report['error'] = 'public_probe_failed'
          finally:
              report_path.write_text(json.dumps(report, sort_keys=True) + '\n')
              print(json.dumps(report, sort_keys=True))
          raise SystemExit(0 if report['status'] == 'probe_passed' else 1)
          PY
      - name: Upload only public probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-container-probe
          path: ${{ runner.temp }}/public-container-probe.json
          if-no-files-found: error
          retention-days: 7
