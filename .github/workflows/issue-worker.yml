name: Issue worker
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Explicit issue number; never scans the backlog'
        required: true
        type: string
      operation:
        description: 'Planning only; no product implementation'
        required: true
        default: plan
        type: choice
        options: [plan, smoke]
      change_name:
        description: 'Optional existing OpenSpec change name'
        required: false
        type: string
concurrency:
  group: c2s-issue-worker-main
  cancel-in-progress: false
permissions: {}
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      selected: ${{ steps.queue.outputs.selected }}
      phase: ${{ steps.queue.outputs.phase }}
      base_sha: ${{ steps.queue.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: queue
        run: python3 -m scripts.issue_worker prepare
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_MODEL_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          C2S_ISSUE_NUMBER: ${{ inputs.issue_number }}
          C2S_OPERATION: ${{ inputs.operation }}
          C2S_CHANGE_NAME: ${{ inputs.change_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.queue.outputs.selected == 'true'
        with:
          name: issue-control
          path: .issue-runtime/control/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  model:
    needs: prepare
    if: needs.prepare.outputs.selected == 'true' && needs.prepare.outputs.phase == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m pip install -r requirements-skill.txt
      - run: npm ci
      - run: npm run setup:codex
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-control
          path: .issue-runtime/control/
      - run: python3 -m scripts.issue_worker model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENSPEC_TELEMETRY: '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: issue-agent
          path: .issue-runtime/agent/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    needs: [prepare, model]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.selected == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m pip install -r requirements-skill.txt
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue-control
          path: .issue-runtime/control/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.model.result == 'success'
        with:
          name: issue-agent
          path: .issue-runtime/agent/
      - run: python3 -m scripts.issue_worker publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_OK: ${{ needs.model.result == 'success' }}
          OPENSPEC_TELEMETRY: '0'
