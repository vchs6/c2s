name: Validate project baseline
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Check public development tools without nested Codex
        run: python3 scripts/check_public_environment.py
      - name: Prepare public role repositories without claiming isolation
        run: python3 scripts/prepare_role_repositories.py --source . --ref "$GITHUB_SHA" --destination "$RUNNER_TEMP/c2s-role-repositories"
      - name: 安装公开契约校验依赖
        run: python3 -m pip install -r requirements-semantic-model.txt
      - run: npm test
      - run: npm run check:artifacts
      - run: npm run validate
        env:
          OPENSPEC_TELEMETRY: '0'
      - run: git diff --check
