# Public template: install as .github/workflows/credential-check.yml in the
# private acceptance repository. Authentication only; no inference or suite.
name: Credential authentication diagnostic

on:
  push:
    paths:
      - '.github/workflows/credential-check.yml'
  workflow_dispatch:

permissions: {}

jobs:
  credential-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Secret presence and API authentication
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          result = {
              "credential_present": False,
              "authentication_passed": False,
              "http_status": None,
              "error": "missing_credential",
              "inference_tested": False,
              "role_boundary_verified": False,
              "development_ready": False,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def record_status(status):
              result["http_status"] = status
              if status == 200:
                  result["authentication_passed"] = True
                  result["error"] = None
              elif status == 401:
                  result["error"] = "unauthorized"
              elif status == 403:
                  result["error"] = "forbidden"
              elif 300 <= status < 400:
                  result["error"] = "redirect_rejected"
              else:
                  result["error"] = "http_error"

          key = os.environ.get("OPENAI_API_KEY", "")
          if key.strip():
              result["credential_present"] = True
              try:
                  request = urllib.request.Request(
                      "https://api.openai.com/v1/models",
                      headers={"Authorization": "Bearer " + key},
                      method="GET",
                  )
                  opener = urllib.request.build_opener(RejectRedirects())
                  # Never read or print the response body, headers or model list.
                  with opener.open(request, timeout=30) as response:
                      record_status(response.status)
              except urllib.error.HTTPError as error:
                  record_status(error.code)
                  error.close()
              except (urllib.error.URLError, TimeoutError, OSError):
                  result["error"] = "network_error"
              except Exception:
                  # Never expose exception text: it may include sensitive data.
                  result["error"] = "diagnostic_error"

          print(json.dumps(result, sort_keys=True))
          sys.exit(0 if result["authentication_passed"] else 1)
          PY
