schema: spec-driven
context: |
  c2s develops a language-independent software-project semantic-fact extraction Skill.
  Artifacts use Chinese; preserve OpenSpec structural headings and SHALL/MUST.
  Use DDD for ubiquitous language, identity and invariants; do not preselect aggregates or storage.
  Accepted layers: E0 engineering organization, E1 build/assembly/delivery,
  E2 program structure/interfaces, E3 operational contracts, E4 algorithms/local semantics.
  Layers are organization scales, not a mandatory containment/refinement chain.
  Approved scope is recorded in docs/decisions/0001-five-semantic-layers.md.
  Imported research under docs/domain and docs/development/reviews is evidence, not automatically approved specs.
  Coordinate actual OpenSpec instructions with installed Superpowers Skills.
  All repository-owned scripts and tests MUST use Python 3; pinned third-party CLIs remain upstream tools.
  Current mode: explicit manual start, continuous planning within authorized session, product implementation disabled.
  Issues/comments/labels/schedules MUST NOT start work. Current maintenance Runner permits plan/smoke only.
  Separate scheme confirmation, whole-plan review and explicit product implementation approval.
  Cover functional and nonfunctional requirements, including query performance/cost/scaling and cross-language/cross-platform matrices.
  Token consumption is an explicit goal for both planning and Skill runtime; plan metering, reuse, bounded retries and evidence-based budgets without inventing measured savings.
  Source language, Skill host platform and analyzed-project target platform are separate dimensions; do not claim universal support.
rules:
  proposal:
    - State scope, affected capabilities and exclusions; tooling-only changes may explicitly skip_specs.
  design:
    - Distinguish observed evidence, accepted decisions, delegated agent decisions and proposed implementation choices.
    - Include workload/scale/environment-bound nonfunctional goals and language/host/target support boundaries.
  tasks:
    - Every task records upstream basis, deliverable paths, verification, pass and failure conditions.
    - Use one authoritative task list; Superpowers plans reference it.
operations:
  apply:
    guidance:
      - Retrieve apply instructions and verify each task; artifact existence is not implementation completion.
  archive:
    guidance:
      - Do not archive without an explicit user request.
